name: Collect 붉은사막 Guides

on:
  schedule:
    # 6시간마다 실행 (UTC 기준 0,6,12,18시 = KST 9,15,21,3시)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 공략글 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GUIDE_QUERY: '붉은사막 공략'
          GUIDE_DISPLAY: '30'
        run: node scripts/collect-guides.mjs

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/guides.json
          git diff --staged --quiet || git commit -m "chore: 붉은사막 공략글 자동 갱신 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push
